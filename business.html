<script src="js/site.js"></script><script src="js/layout.js"></script><script src="js/app.js"></script><script>(function(){var H=window.H,S=H.S,id=new URLSearchParams(location.search).get('id')||'tribe-maker';

var offers=S.offers.filter(function(o){return o.biz===b.id});
H.$('#biz').innerHTML='<section class="phero bizhero"><div class="wrap"><p class="kicker">'+H.catName(b.cat)+' / '+b.sub+'</p><h1>'+H.esc(b.name)+'</h1><p>'+H.esc(b.tagline)+'</p></div></section>'+
'<section class="band tight"><div class="wrap split"><div class="profile-body">'+H.badges(b)+(b.ownerNote?'<p class="recs" style="font-size:1.25rem">'+b.ownerNote+'</p>':'')+(b.about?'<p>'+H.esc(b.about)+'</p>':'')+(b.note?'<p class="note">'+b.note+'</p>':'')+
(b.recs?'<h3>Recommended by '+b.recs+' Harvest neighbors '+H.EX+'</h3>':'')+
'<form data-proto style="margin-top:20px"><fieldset class="seg" style="border:0;padding:0"><legend style="font-weight:600">Would you recommend '+H.esc(b.name)+' to a neighbor?</legend><label style="border-color:#b9b1a2"><input type="radio" name="rec" value="yes">Yes</label><label style="border-color:#b9b1a2"><input type="radio" name="rec" value="no">No</label></fieldset><label for="help">What did they help with?</label><input id="help" type="text"><p><button class="btn btn-dark" type="submit">Submit recommendation</button></p><p class="formmsg note" role="status"></p></form></div>'+
'<aside class="card"><h3>Contact</h3>'+(b.phone?'<a class="btn btn-dark" href="tel:'+b.phone.replace(/\D/g,'')+'">Call '+b.phone+'</a>':'')+(b.web?'<a class="btn btn-ghost" href="'+b.web+'" rel="noopener">Visit website</a>':'')+(b.email?'<a class="btn btn-ghost" href="mailto:'+b.email+'">Email</a>':'')+
'<a class="btn btn-gold" href="#">'+H.cta(b)+'</a>'+H.saveBtn('biz',b.id,b.name)+(b.city?'<p class="sub">'+b.city+'</p>':'')+(b.views?'<p class="sub">'+b.views+' profile views (live site)</p>':'')+
offers.map(function(o){return '<hr style="border:0;border-top:1px solid #eee;width:100%"><span class="offer"><span class="kind">'+o.kind+'</span></span><b>'+H.esc(o.title)+'</b>'}).join('')+'</aside></div></section>'})()</script>
