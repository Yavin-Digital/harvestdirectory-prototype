<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Harvest | Harvest Directory</title><meta name="description" content="Your saved Harvest businesses, offers, events, groups and important contacts."><meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://harvestdirectory-preview.clientreview.co/my-harvest.html"><meta property="og:title" content="My Harvest | Harvest Directory"><meta property="og:description" content="Your saved Harvest businesses, offers, events, groups and important contacts.">
<meta property="og:image" content="https://harvestdirectory-preview.clientreview.co/assets/harvest-farmhouse.jpg"><meta property="og:url" content="https://harvestdirectory-preview.clientreview.co/my-harvest.html"><meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css"></head>
<body data-page="my"><div id="hdr"></div><main id="main">
<section class="phero"><div class="wrap"><p class="kicker">My Harvest</p><h1>Your Harvest, saved</h1><p>Tap Save on any business, deal, group or contact. Saved on this device only.</p></div></section><section class="band tight"><div class="wrap" id="my"></div></section>
</main><div id="ftr"></div>
<script src="js/site.js"></script><script src="js/layout.js"></script><script src="js/app.js"></script><script>window.renderMy=function(){var H=window.H,S=H.S,s=H.store(),out='';
var sec=function(t,a,f){return a.length?'<h2 style="margin-top:40px">'+t+'</h2><div class="list">'+a.map(f).join('')+'</div>':''};
out+=sec('Businesses',S.businesses.filter(function(b){return (s.biz||[]).indexOf(b.id)>-1}),H.bizCard);
out+=sec('Saved offers',S.offers.filter(function(o){return (s.offer||[]).indexOf(o.id)>-1}),H.offerCard);
out+=sec('Groups',S.community.filter(function(c,i){return (s.group||[]).indexOf('g'+i)>-1}),function(c){return '<article class="card"><h3>'+H.esc(c.name)+'</h3></article>'});
var ids=s.contact||[];var con=S.resources.filter(function(r){return r.id==='fire'||r.id==='trash'||r.id==='hoa'||ids.indexOf(r.id)>-1});
out+='<h2 style="margin-top:40px">Important contacts</h2><div class="list">'+con.map(function(r){return '<article class="card"><span class="kicker" style="margin:0">'+r.group+'</span><h3>'+H.esc(r.name)+'</h3><p>'+H.esc(r.detail)+'</p>'+(r.phone?'<a class="btn btn-dark" href="tel:'+r.phone.replace(/\D/g,'')+'">'+r.phone+'</a>':'')+'</article>'}).join('')+'</div>';
if(!(s.biz||[]).length&&!(s.offer||[]).length)out='<p>Nothing saved yet. <a href="members.html">Browse local businesses</a> or <a href="offers.html">deals</a> and tap Save.</p>'+out;
H.$('#my').innerHTML=out};renderMy();</script>
</body></html>
