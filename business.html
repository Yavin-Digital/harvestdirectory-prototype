<body data-page="members"><div id="hdr"></div><main id="main">
<div id="biz"></div>
</main><div id="ftr"></div>
<script src="js/site.js"></script><script src="js/layout.js"></script><script src="js/app.js"></script><script>(function(){var H=window.H,S=H.S,id=new URLSearchParams(location.search).get('id')||'tribe-maker';
var b=S.businesses.filter(function(x){return x.id===id&&x.source==='live'})[0]||S.businesses[0];document.title=b.name+' | Harvest Directory';
var offers=S.offers.filter(function(o){return o.biz===b.id});
var recN=b.recsApproved||b.recs||0;
H.$('#biz').innerHTML='<section class="phero bizhero"><div class="wrap"><p class="kicker">'+H.catName(b.cat)+' / '+b.sub+'</p><h1>'+H.esc(b.name)+'</h1><p>'+H.esc(b.tagline)+'</p>'+(b.subtagline?'<p class="subtag">'+H.esc(b.subtagline)+'</p>':'')+'</div></section>'+
(b.cover?'<section class="band tight bizcover-band"><div class="wrap"><div class="bizcover"><img class="bizbanner" src="'+b.cover+'" alt="'+H.esc(b.name)+' cover banner" width="2172" height="724">'+(b.logo?'<img class="bizlogo" src="'+b.logo+'" alt="'+H.esc(b.name)+' logo" width="512" height="512">':'')+'</div></div></section>':'')+
'<section class="band tight"><div class="wrap split"><div class="profile-body">'+(b.liveTag||b.verifiedMember?'<p class="livetags">'+(b.liveTag?'<span class="tag">'+H.esc(b.liveTag)+'</span>':'')+(b.verifiedMember?'<span class="tag vm">Verified Member</span>':'')+'</p>':'')+H.badges(b)+(b.ownerNote?'<p class="recs" style="font-size:1.25rem">'+b.ownerNote+'</p>':'')+
(b.aboutParas?'<h2 class="abouth">About</h2>'+b.aboutParas.map(function(t){return '<p>'+H.esc(t)+'</p>'}).join(''):(b.about?'<p>'+H.esc(b.about)+'</p>':''))+(b.note?'<p class="note">'+b.note+'</p>':'')+
(recN?'<h3>Recommended by '+recN+' Harvest neighbors '+(b.recsExample?H.EX:'')+'</h3><p class="note">Only admin-approved recommendations are counted.</p>':'')+
'<form id="recform" data-biz="'+b.id+'" style="margin-top:20px"><fieldset class="seg" style="border:0;padding:0"><legend style="font-weight:600">Would you recommend '+H.esc(b.name)+' to a neighbor?</legend><label><input type="radio" name="rec" value="yes" required>Yes</label><label><input type="radio" name="rec" value="no">No</label></fieldset><label for="recname">Your name</label><input id="recname" type="text" autocomplete="name" required><label for="help">What did they help with?</label><input id="help" type="text"><p><button class="btn btn-dark" type="submit">Submit recommendation</button></p><p class="formmsg note" role="status"></p><div id="pending"></div></form></div>'+
'<aside class="card"><h3>Contact</h3>'+(b.phone?'<a class="btn btn-dark" href="tel:'+b.phone.replace(/\D/g,'')+'">Call '+b.phone+'</a>':'')+(b.web?'<a class="btn btn-ghost" href="'+b.web+'" rel="noopener">Visit website</a>':'')+(b.directions?'<a class="btn btn-ghost" href="'+b.directions+'" rel="noopener">Get Directions</a>':'')+(b.email?'<a class="btn btn-ghost" href="mailto:'+b.email+'">Email '+b.email+'</a>':'')+
'<a class="btn btn-gold" href="'+(b.email?'mailto:'+b.email+'?subject=Quote%20request%20from%20Harvest%20Directory':'#')+'">Request a Quote</a>'+'<a class="btn btn-ghost" href="#">'+H.cta(b)+'</a>'+H.saveBtn('biz',b.id,b.name)+(b.city?'<p class="sub">'+b.city+'</p>':'')+(b.views?'<p class="views"><b>'+b.views+'</b> Profile Views</p>':'')+'</aside></div></section>'+
(offers.length?'<section class="band tight white"><div class="wrap"><div class="card specialoffer"><p class="kicker">Special Offer</p>'+offers.map(function(o){return '<h3>'+H.esc(o.title)+'</h3>'}).join('')+'<a class="btn btn-gold" href="'+(b.email?'mailto:'+b.email+'?subject=Special%20offer':'#')+'">Request a Quote</a></div></div></section>':'');
H.wireRecs();})()</script>
